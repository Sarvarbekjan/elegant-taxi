name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java muhitini sozlash
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Yetishmayotgan Android fayllarini yaratish
        run: flutter create . --platforms=android --org=com.elegant.taxi

      - name: Kutubxonalarni yuklash
        run: flutter pub get

      - name: APK faylni yig'ish
        run: flutter build apk --release

      - name: Tayyor APK faylni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: ElegantTaxi-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
